<script>
"use strict";
// ---------- procedural art ----------
let _s=1234567;function rnd(){_s=(_s*1664525+1013904223)>>>0;return _s/4294967296}
function pack(r,g,b,a){return ((a<<24)|(b<<16)|(g<<8)|r)>>>0}
function clamp(v,a,b){return v<a?a:v>b?b:v}
const TEX=[];   // index = wall code
function mkTex(fn){const t=new Uint32Array(4096);for(let y=0;y<64;y++)for(let x=0;x<64;x++){const c=fn(x,y);t[y*64+x]=pack(clamp(c[0]|0,0,255),clamp(c[1]|0,0,255),clamp(c[2]|0,0,255),255)}return t}
function nz(x,y,s){let n=Math.sin(x*12.9898*s+y*78.233*s)*43758.5453;return n-Math.floor(n)}
function vnoise(x,y,s){const xi=Math.floor(x/s),yi=Math.floor(y/s),xf=x/s-xi,yf=y/s-yi;const a=nz(xi,yi,1),b=nz(xi+1,yi,1),c=nz(xi,yi+1,1),d=nz(xi+1,yi+1,1);const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function buildTextures(){
  // 1 brick
  TEX[1]=mkTex((x,y)=>{const row=(y>>3),off=(row&1)?8:0,bx=(x+off)&15,by=y&7;let m=(by==0||bx==0);const id=row*7+(((x+off)>>4)&3);const sh=0.75+nz(id,3,1)*0.4;const n=(nz(x,y,2)-.5)*28;
    if(m)return[44+n*.3,38+n*.3,34+n*.3];return[118*sh+n,82*sh+n*.8,66*sh+n*.7]});
  // 2 tech panel
  TEX[2]=mkTex((x,y)=>{const n=(nz(x,y,3)-.5)*14;let r=58,g=68,b=82;
    if(x%32<2||y%32<2||x%32>29||y%32>29){r=28;g=34;b=44}
    else if(y%32>12&&y%32<17&&x%32>6&&x%32<26){const lit=((x>>3)+(y>>5))%3==0;r=lit?255:50;g=lit?170:60;b=lit?60:70;if(lit){r=235;g=150;b=50}}
    if(((x%32==4)||(x%32==27))&&((y%32==4)||(y%32==27))){r=140;g=150;b=160}
    return[r+n,g+n,b+n]});
  // 3 hell flesh/stone with glowing cracks
  TEX[3]=mkTex((x,y)=>{const n=vnoise(x,y,8)*.6+vnoise(x,y,3)*.4;const v=vnoise(x+40,y*0.6,6)+vnoise(x*1.7,y*.8+9,4)*.5;const crack=Math.abs(v-.78)<.045;
    if(crack)return[255,120+nz(x,y,5)*80,30];return[70+n*80,18+n*20,16+n*14]});
  // 4 door (steel)
  TEX[4]=mkTex((x,y)=>{const n=(nz(x,y,2)-.5)*12;let v=120;const e=(x<3||x>60||y<3||y>60);if(e)v=70;
    if(((x+y)>>3)%2==0&&!e&&y>20&&y<44)return[200+n,170+n,40];if(Math.abs(x-32)<1&&!e)v=60;return[v+n,v+8+n,v+14+n]});
  // 5 red door, 6 blue door
  const keyDoor=(c)=>mkTex((x,y)=>{const n=(nz(x,y,2)-.5)*14;const e=(x<4||x>59||y<4||y>59);if(e)return[60,60,66];
    const d=Math.hypot(x-32,y-32);if(d<9)return[c[0],c[1],c[2]];if(d<12)return[30,30,30];return[c[0]*.45+n,c[1]*.45+n,c[2]*.45+n]});
  TEX[5]=keyDoor([220,36,30]);TEX[6]=keyDoor([50,110,240]);
  // 7 exit
  TEX[7]=mkTex((x,y)=>{const n=(nz(x,y,2)-.5)*10;const e=(x<3||x>60||y<3||y>60);if(e)return[40,70,40];
    const sx=x-32,sy=y-32;if(Math.abs(sx)<22&&Math.abs(sy)<8)return(Math.abs(sx)%6<3&&Math.abs(sy)<5)?[240,255,220]:[30,150,60];
    return[40+n,110+n,60+n]});
}
// ---------- sprites ----------
const SPR={};
function mkSpr(name,draw){const cv=document.createElement('canvas');cv.width=cv.height=64;const c=cv.getContext('2d');c.imageSmoothingEnabled=false;draw(c);
  const d=c.getImageData(0,0,64,64).data;const out=new Uint32Array(4096);for(let i=0;i<4096;i++){const a=d[i*4+3];out[i]=a<128?0:pack(d[i*4],d[i*4+1],d[i*4+2],255)}SPR[name]=out}
function R(c,col,x,y,w,h){c.fillStyle=col;c.fillRect(x,y,w,h)}
function humanoid(c,o,f){

  const s=o.s||1;const L=f===0?[24,36]:[28,32];
  R(c,o.dark,L[0],44,8,18);R(c,o.dark,L[1],44,8,18);R(c,'#111',L[0]-1,60,10,3);R(c,'#111',L[1]-1,60,10,3);
  R(c,o.body,20,20,24,26);R(c,o.dark,20,40,24,4);R(c,o.trim,30,22,4,20);
  R(c,o.skin,26,8,12,12);R(c,o.helm,24,6,16,6);

  if(f===2){R(c,o.body,44,18,12,6);R(c,o.skin,54,14,8,8);R(c,o.gun,40,24,18,4);R(c,'#ffe070',58,22,5,6);R(c,'#fff',60,23,3,3);R(c,o.body,12,28,8,8)}
  else{R(c,o.body,12,24,8,16);R(c,o.skin,12,38,8,6);R(c,o.body,44,24,8,16);R(c,o.skin,44,38,8,6);R(c,o.gun,50,38,10,4)}

  const imp={body:'#7a4a2a',dark:'#4a2a16',trim:'#a06a3a',skin:'#8a5232',helm:'#5a3018',eye:'#ffd23a',gun:'#a03020',horns:1};

    const b=f===0?0:2;
    R(c,'#a85060',10,30,44,24);R(c,'#c86878',12,28,40,12);R(c,'#8a3848',10,48,44,6);
    R(c,'#a85060',14+b,52,10,10);R(c,'#a85060',40-b,52,10,10);R(c,'#3a1a1a',14+b,60,10,3);R(c,'#3a1a1a',40-b,60,10,3);
    R(c,'#c86878',34,14,26,22);R(c,'#e8dcc0',58,14,3,6);R(c,'#e8dcc0',36,10,3,6);R(c,'#ffe030',46,20,4,3);
    R(c,'#601018',44,28,18,(f===2?10:5));R(c,'#fff',46,28,2,3);R(c,'#fff',50,28,2,3);R(c,'#fff',54,28,2,3);R(c,'#fff',58,28,2,3);
    R(c,'#8a3848',6,36,8,6);R(c,'#e8dcc0',4,40,3,3);

  mkSpr('armor',c=>{R(c,'#2a8a3a',16,34,32,26);R(c,'#1a5a28',16,54,32,6);R(c,'#4acf60',20,34,8,10);R(c,'#4acf60',36,34,8,10);R(c,'#0b0b0b',28,34,8,8)});

  mkSpr('shotgun',c=>{R(c,'#6a3a1a',8,50,22,6);R(c,'#555',22,48,34,3);R(c,'#777',22,52,34,3)});
  mkSpr('chaingun',c=>{R(c,'#333',10,46,44,12);R(c,'#777',34,42,24,3);R(c,'#999',34,46,24,3);R(c,'#999',34,50,24,3);R(c,'#aa7a20',14,54,8,6)});
  mkSpr('barrel',c=>{R(c,'#3a7a2a',20,22,24,40);R(c,'#2a5a1e',20,28,24,3);R(c,'#2a5a1e',20,50,24,3);R(c,'#b0b020',28,36,8,8);R(c,'#222',30,38,4,4);R(c,'#4a9a3a',22,22,5,40)});

  mkSpr('fire',c=>{c.fillStyle='#ff5a10';c.beginPath();c.arc(32,34,12,0,7);c.fill();c.fillStyle='#ffb030';c.beginPath();c.arc(32,34,8,0,7);c.fill();c.fillStyle='#fff6c0';c.beginPath();c.arc(32,34,4,0,7);c.fill()});

  mkSpr('boom1',c=>{c.fillStyle='#b83010';c.beginPath();c.arc(32,32,30,0,7);c.fill();c.fillStyle='#ff6a1a';c.beginPath();c.arc(32,32,22,0,7);c.fill();c.fillStyle='#ffb040';c.beginPath();c.arc(32,32,12,0,7);c.fill()});
  mkSpr('puff',c=>{c.fillStyle='#bba';c.beginPath();c.arc(32,40,5,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(32,40,2,0,7);c.fill()});

// ---------- levels ----------
function LV(name,w,h,bw){
  const L={name,w,h,g:new Uint8Array(w*h).fill(bw||1),ents:[],start:[2.5,2.5,0],par:0};
  L.carve=(x0,y0,x1,y1,wall)=>{
    for(let y=y0-1;y<=y1+1;y++)for(let x=x0-1;x<=x1+1;x++){
      const inside=x>=x0&&x<=x1&&y>=y0&&y<=y1;
      if(inside)L.g[y*w+x]=0;else if(wall&&L.g[y*w+x]!==0&&L.g[y*w+x]<4)L.g[y*w+x]=wall}
  };
  L.cell=(x,y,c)=>{L.g[y*w+x]=c};
  L.put=(t,x,y,n)=>{for(let i=0;i<(n||1);i++)L.ents.push({t,x:x+.5+(i?((i%2)?.3:-.3)*(i):0),y:y+.5+(i?(i%3-1)*.3:0)})};
  return L;
}
function level1(){

  L.put('grunt',11,2);L.put('grunt',12,5);L.put('ammo',9,1);L.put('torch',14,1);

  L.put('shotgun',27,8);L.put('health',17,1);L.put('ammo',28,5,2);L.put('barrel',23,8);L.put('barrel',24,8);

function level2(){
  const L=LV('E1M2 · The Foundry',40,32,2);

}
function controlsScreen(){
  show(`<h2>Controls</h2><p><kbd>W A S D</kbd> move · <kbd>Shift</kbd> run · <kbd>←</kbd><kbd>→</kbd> turn · mouse look after clicking the screen<br>
  <kbd>Click</kbd> / <kbd>Space</kbd> / <kbd>Ctrl</kbd> fire · <kbd>E</kbd> / right-click open doors &amp; exits<br>
  <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> / <kbd>Q</kbd> / wheel switch weapon · <kbd>Tab</kbd> map · <kbd>Esc</kbd> pause<br>Touch: left pad moves, drag anywhere to turn, big button fires.</p>
  <p>Red and blue doors need the matching key. Shoot barrels near monsters.</p><button class="btn" id="bBack">Back</button>`);
  bind('bBack',()=>state==='pause'?pauseScreen():titleScreen());
}
function settingsScreen(){
  show(`<h2>Settings</h2>
  <div class="row"><label for="sGfx">Graphics</label><select id="sGfx"><option value="auto">Auto</option><option value="low">Low (fastest)</option><option value="med">Medium</option><option value="high">High</option></select></div>
  <div class="row"><label for="sSens">Look speed</label><input id="sSens" type="range" min="0.3" max="2.5" step="0.1"></div>
  <div class="row"><label for="sVol">Volume</label><input id="sVol" type="range" min="0" max="1" step="0.05"></div>
  <div class="row"><label for="sMus">Music</label><input id="sMus" type="checkbox"></div>
  <button class="btn" id="bBack">Back</button>`);
  const g=document.getElementById('sGfx'),s=document.getElementById('sSens'),v=document.getElementById('sVol'),m=document.getElementById('sMus');
  g.value=SET.gfx;s.value=SET.sens;v.value=SET.vol;m.checked=SET.music;
  g.onchange=()=>{SET.gfx=g.value;applyGfx();saveSet()};s.oninput=()=>{SET.sens=+s.value;saveSet()};v.oninput=()=>{SET.vol=+v.value;if(MASTER)MASTER.gain.value=SET.vol;saveSet()};m.onchange=()=>{SET.music=m.checked;saveSet()};
  bind('bBack',()=>state==='pause'?pauseScreen():titleScreen());
}
function pauseScreen(){show(`<h2>Paused</h2><button class="btn" id="bRes">Resume</button><button class="btn" id="bRs">Restart Level</button><button class="btn" id="bSet">Settings</button><button class="btn" id="bCtl">Controls</button><button class="btn" id="bQ">Quit to Title</button>`);
  bind('bRes',resumeGame);bind('bRs',()=>startGame(G.lvl,true));bind('bSet',settingsScreen);bind('bCtl',controlsScreen);bind('bQ',()=>{if(document.pointerLockElement)document.exitPointerLock();titleScreen()})}
function pauseGame(){if(state!=='play')return;state='pause';if(document.pointerLockElement)document.exitPointerLock();fireMouse=false;tFire=false;pauseScreen()}
function resumeGame(){state='play';hide();last=performance.now()}
function startGame(i,retry){
  let keep=null;
  if(retry&&snap)keep=Object.assign({},snap,{have:snap.have.slice()});
  else if(i>0&&G.P&&G.lvl===i-1)keep=G.P&&nextKeep;
  loadLevel(i,keep?Object.assign({},keep,{have:keep.have.slice()}):null);
  snap=Object.assign({},G.P,{have:G.P.have.slice()});
  AUTOMAP=false;state='play';hide();last=performance.now();
  if(touchOn)document.getElementById('touch').hidden=false;
}
let nextKeep=null;
function onDeath(){setTimeout(()=>{if(state!=='play')return;state='dead';if(document.pointerLockElement)document.exitPointerLock();show(`<h2 style="color:#ff3a2a">You Died</h2><p>The imps send their regards.</p><button class="btn" id="bRetry">Retry Level</button><button class="btn" id="bQ">Title</button>`);bind('bRetry',()=>startGame(G.lvl,true));bind('bQ',titleScreen)},1300)}
function onLevelEnd(){
  const P=G.P;nextKeep=Object.assign({},P,{have:P.have.slice()});
  try{unlocked=Math.max(unlocked,G.lvl+1);localStorage.setItem('bb_unlock',String(Math.min(unlocked,3)))}catch(e){}
  setTimeout(()=>{state='end';if(document.pointerLockElement)document.exitPointerLock();
    const last3=G.lvl>=2,par=G.L.par,beat=G.time<=par;
    show(`<h2>${last3?'Hellmouth Cleared':'Level Complete'}</h2><p>${G.L.name}</p>
    <p style="color:var(--bone);font-size:15px;line-height:1.9">Kills ${G.kills} / ${G.totalKills}<br>Items ${G.items} / ${G.totalItems}<br>Time ${fmtTime(G.time)} <span style="color:${beat?'#7ee08a':'#9a8272'}">(par ${fmtTime(par)})</span></p>
    ${last3?'<p>You walked out of hell. It will be back.</p><button class="btn" id="bT">Back to Title</button>':'<button class="btn" id="bN">Next Level</button>'}`);
    bind('bN',()=>startGame(G.lvl+1));bind('bT',()=>{unlocked=0;try{localStorage.setItem('bb_unlock','0')}catch(e){}titleScreen()});
  },900);
}
// ---------- graphics / loop ----------
function weak(){const ua=navigator.userAgent||'';return /Android|iPhone|iPad|Mobile|CrOS/i.test(ua)||(navigator.hardwareConcurrency||4)<=4||(navigator.deviceMemory||8)<=4}
let gfxLevel=1;
function applyGfx(){const m=SET.gfx==='auto'?(weak()?'low':'med'):SET.gfx;gfxLevel={low:0,med:1,high:2}[m];const R=[[200,125],[320,200],[480,300]][gfxLevel];setRes(R[0],R[1]);sizeUI()}
let last=performance.now(),slow=0,fpsAcc=0;
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(.05,(now-last)/1000);last=now;
  if(state==='play'||state==='dead'||state==='end'){
    if(state==='play'&&!G.over||state==='play'){
      G.time+=dt;const inp=readInput();
      if(!G.over||G.P.hp>0)updatePlayer(dt,inp);
      updateDoors(dt);updateEnemies(dt);updateProj(dt);pickups();
      if(G.hintT>0){G.hintT-=dt;hintEl.hidden=false;hintEl.textContent=G.hint}else hintEl.hidden=true;
    }
    // adaptive resolution on Auto
    if(SET.gfx==='auto'&&dt>.034){slow+=dt}else slow=Math.max(0,slow-dt*.5);
    if(slow>2&&gfxLevel>0){gfxLevel--;const R=[[200,125],[320,200],[480,300]][gfxLevel];setRes(R[0],R[1]);slow=0}
    render();drawHUD();
  }else if(state==='title'||state==='pause'){
    // keep the last frame; title shows animated background
    if(state==='title'){G.time+=dt;if(!G.P)loadLevel(0,null);G.P.a+=dt*.25;G.P.bob+=dt*2;render();uctx.clearRect(0,0,ui.width,ui.height)}
  }
}
window.addEventListener('resize',sizeUI);
applyGfx();loadLevel(0,null);titleScreen();requestAnimationFrame(frame);
window.__BB={G,startGame,sfx,get state(){return state}};
</script>
